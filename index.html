<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }
    h1 {
      font-size: 32px;
      letter-spacing: 4px;
      margin-bottom: 48px;
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 720px;
    }
    a.card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 24px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1a1a1a;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    a.card:hover {
      border-color: #4af;
      background: #0d1f30;
    }
    .card-icon { font-size: 36px; }
    .card-title { font-size: 18px; color: #fff; }
    .card-desc { font-size: 12px; color: #888; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>ARCADE</h1>
  <div class="grid">
    <a class="card" href="/arcade/mirror-horde/">
      <span class="card-icon">⊕</span>
      <span class="card-title">Mirror Horde</span>
      <span class="card-desc">レーザーと鏡で敵の群れを迎撃するタワーディフェンス</span>
    </a>
    <a class="card" href="/arcade/mujun/">
      <span class="card-icon">⚔</span>
      <span class="card-title">矛盾庭</span>
      <span class="card-desc">矛盾する力がせめぎ合うパズルアクション</span>
    </a>
  </div>
</body>
</html>
